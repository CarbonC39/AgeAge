name: Build and Release

on:
  push:
    branches:
      - public

jobs:
  release:
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build binaries (cross-platform)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          targets="linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64"
          for t in $targets; do
            export GOOS=${t%/*} GOARCH=${t#*/}
            out="dist/ageage-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && out="${out}.exe"
            echo "Building $out"
            go build -trimpath -ldflags "-s -w" -o "$out" .
          done
          ls -lh dist

      - name: Publish to "latest" release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: https://codeberg.org
          repo: ${{ github.repository }}
          tag: latest
          sha: ${{ github.sha }}
          release-dir: dist
          release-notes: "Rolling build from ${{ github.sha }}"
          override: true
          token: ${{ github.token }}
