name: Build and Release

on:
  push:
    branches:
      - public

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          targets="linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64"
          for target in $targets; do
            export GOOS=${target%/*} GOARCH=${target#*/}
            output="dist/ageage-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && output="${output}.exe"
            echo "Building $output"
            go build -trimpath -ldflags "-s -w" -o "$output" .
          done

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          notes="Rolling build from ${GITHUB_SHA}"
          # Recreate the rolling release on every build. Deleting first keeps it
          # clean and published even when a previous run left it as a draft or
          # prerelease (which GitHub refuses to mark --latest). The tag itself is
          # force-pushed above; --cleanup-tag=false keeps it, and --target below
          # recreates it at the build commit even if it somehow disappears.
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag=false
          fi
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "$notes" \
            --latest
